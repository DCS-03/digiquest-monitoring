# Local development. Copy deployment/.env.example to deployment/.env and fill in values.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: digiquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: digiquest
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiquest"]
      interval: 5s
      retries: 10
  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://digiquest:${POSTGRES_PASSWORD}@db:5432/digiquest
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      SCREENSHOT_STORAGE_PATH: /data/screenshots
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: [screenshots:/data/screenshots]
volumes:
  pgdata:
  screenshots:
